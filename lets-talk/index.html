<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Talk — Arnob Baral</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <div id="header-placeholder"></div>

    <div class="page">

        <div class="section">
            <div class="split_layout">

                <div class="split_content">
                    <div class="header_text_group">
                        <div class="header_text_group">
                <h1 class="subtitle">Let's Talk</h1>
                <p class="txt">about your next website, a design idea, how things should work, or anything else on your mind. No pressure — just drop a message and we'll go from there.</p>
            </div>
                    </div>

                    <form class="contact_form" action="#" method="POST" onsubmit="event.preventDefault(); alert('Got it — I\'ll reply soon.');">
                        <input type="text" class="contact_input" placeholder="Name" required>
                        <input type="email" class="contact_input" placeholder="Email" required>
                        <textarea class="contact_input contact_textarea" placeholder="Your message" required></textarea>

                        <div class="featured_work_button">
                            <button type="submit" class="cta_button_alt cta_button txt">
                                <svg class="arrow_icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M7 17L17 7M17 7H8M17 7V16"></path>
                                </svg>
                                <span>Send Message</span>
                            </button>
                        </div>
                    </form>
                </div>

                <div class="split_media">
                    <img src="../images/arnob.webp" alt="Arnob Baral">
                </div>

            </div>
        </div>

    </div>

    <div id="footer-placeholder"></div>

    <script src="../components.js" data-root="1"></script>
</body>

</html>
